<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inspirational Quotes</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ff7eb3, #ff758c, #ff9a8b, #fad0c4, #fad390);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      background: rgba(0,0,0,0.4);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      max-width: 800px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #ffe082;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    p {
      font-size: 1.4rem;
      margin: 18px 0;
      line-height: 1.6;
      background: linear-gradient(90deg, #ffecd2, #fcb69f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Inspirational Quotes</h1>
    <p>🌟 Believe you can and you’re halfway there.</p>
    <p>🔥 Success is not final, failure is not fatal.</p>
    <p>💡 The best way to predict the future is to create it.</p>
    <p>🚀 Dreams don’t work unless you do.</p>
    <p>🌈 Keep going, because you did not come this far only to stop.</p>
  </div>
</body>
</html>
